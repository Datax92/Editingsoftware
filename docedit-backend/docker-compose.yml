version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always

  docedit-backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./uploads:/app/uploads
    restart: always

  docedit-worker:
    build: .
    command: npm run worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./uploads:/app/uploads
    restart: always

  onlyoffice:
    image: onlyoffice/documentserver
    ports:
      - "8000:80"
    environment:
      - JWT_ENABLED=false
      - ALLOW_PRIVATE_IP_ADDRESS=true
    volumes:
      - ./my-theme.json:/var/www/onlyoffice/documentserver/web-apps/apps/common/main/resources/themes/my-theme.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always